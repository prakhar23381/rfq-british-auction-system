name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: british_auction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auction" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://auction:auction@localhost:5432/british_auction_test
      TEST_DATABASE_URL: postgresql+psycopg://auction:auction@localhost:5432/british_auction_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage # Vitest with coverage thresholds
      - run: npm run build

  e2e:
    # The whole stack (API, Celery worker + Beat, Postgres, Redis, Vite) driven by Playwright.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: british_auction
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auction" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://auction:auction@localhost:5432/british_auction
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend up (migrate, seed, API, worker, Beat)
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          nohup celery -A app.workers.celery_app worker -l info > /tmp/worker.log 2>&1 &
          nohup celery -A app.workers.celery_app beat -l info > /tmp/beat.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Frontend deps and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/worker.log /tmp/beat.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    # The one-command setup from the README: build every image, start the stack, smoke-test it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/rfqs/some-client-route | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -fsS http://localhost:8080/api/rfqs | jq '.total')" = 5
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200
