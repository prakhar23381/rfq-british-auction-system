name: british-auction

# `docker compose up --build` runs the whole system at http://localhost:8080.
# `make up` starts only postgres + redis, for running the app locally.

x-backend: &backend
  build: ./backend
  image: british-auction-backend
  environment:
    DATABASE_URL: postgresql+psycopg://auction:auction@postgres:5432/british_auction
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["http://localhost:8080"]'
    LOG_LEVEL: INFO
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: british_auction
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d british_auction"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations, then seed demo data (skipped if auctions already exist).
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info"]
    healthcheck:
      # The worker answers a ping through the broker.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      # Beat is alive and can reach the broker it sends the sweep to.
      test: ["CMD", "python", "-c", "import redis; from app.config import get_settings; redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build: ./frontend
    image: british-auction-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
